    <circle cx="60" cy="58" r="10" fill="#FFD21F" stroke-width="2.5"/>
    <!-- Wangen -->
    <ellipse cx="63" cy="63" rx="2.6" ry="1.6" fill="#FFA040" stroke="none"/>
    <!-- Schnabel oben und unten -->
    <path d="M51 55 L40 60 Q37 62 40 63 L51 60 Z" fill="#FF7A1A" stroke-width="1.5"/>
    <path d="M51 60 L41 63 Q39 65 42 66.5 L52 66 Z" fill="#E8600A" stroke-width="1.2"/>
    <!-- Auge mit Glanzpunkt -->
    <circle cx="57" cy="54" r="3.6" fill="#FFFFFF" stroke-width="1.2"/>
    <circle cx="57.5" cy="54.5" r="2" fill="#111111" stroke="none"/>
    <circle cx="58.3" cy="53.6" r="0.7" fill="#FFFFFF" stroke="none"/>
  </g>
