    <!-- Schwanz -->
    <path d="M84 68 L93 58 L90 66 L94 68 L88 78 Z" fill="#FFD21F" stroke-width="2.5"/>
    <!-- Körper -->
    <ellipse cx="70" cy="74" rx="18" ry="12" fill="#FFD21F" stroke-width="2.5"/>
    <!-- Flügel -->
    <path d="M56 72 Q65 65 77 71 Q71 80 57 79 Z" fill="#E8B600" stroke-width="1.2"/>
    <path d="M62 74 Q67 72 72 74" fill="none" stroke-width="1"/>
